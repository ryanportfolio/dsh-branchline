<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 165" width="410" height="165" role="img" aria-label="01. Fresh remote base. Fetch origin, resolve origin/HEAD, and pin its exact commit.">
<style>
text{font-family:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#1f2328}.mute{fill:#59636e}.accent{fill:#bc4c00}
.rule{stroke:#d1d9e0;stroke-width:1.5}.signal{fill:#bc4c00;animation:pulse 2.4s ease-in-out infinite}
.code{fill:#f6f8fa;stroke:#d1d9e0}@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.signal{opacity:1}}
</style>
<line class="rule" x1="18" y1="34" x2="392" y2="34"/>
<circle class="signal" cx="18" cy="34" r="4"/>
<text class="accent" x="30" y="20" font-size="9" font-weight="700" letter-spacing="1.2">01 / FETCH</text>
<text x="18" y="67" font-size="19" font-weight="800">FRESH REMOTE BASE</text>
<text class="mute" x="18" y="92" font-size="11">Fetch origin, resolve origin/HEAD, and pin its</text>
<text class="mute" x="18" y="110" font-size="11">exact commit.</text>
<rect class="code" x="18" y="122" width="374" height="29" rx="3"/>
<text x="29" y="141" font-size="10">origin/HEAD -&gt; &lt;sha&gt;</text>
</svg>
