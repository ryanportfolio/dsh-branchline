<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 470" width="390" height="470" role="img" aria-label="DSH Branchline routes the latest remote default branch into an isolated DSH task while the primary checkout stays untouched.">
<style>
text{font-family:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#1f2328}
.mute{fill:#59636e}.accent{fill:#bc4c00}
.rail{fill:none;stroke:#d1d9e0;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rail-strong{fill:none;stroke:#1f2328;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.route{fill:none;stroke:#bc4c00;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 8;animation:flow 4.8s linear infinite}
.node{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:2}.node-live{fill:#fff1e5;stroke:#bc4c00;stroke-width:2.5;animation:pulse 2.4s ease-in-out infinite}
.tag{fill:#f6f8fa;stroke:#d1d9e0}.tag-live{fill:#fff1e5;stroke:#bc4c00}
@keyframes flow{to{stroke-dashoffset:-68}}@keyframes pulse{0%,100%{opacity:.62}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.route{stroke-dashoffset:0}.node-live{opacity:1}}
</style>

<path class="rail-strong" d="M24 28h32l12 12h30"/><circle class="node-live" cx="24" cy="28" r="5"/>
<text class="mute" x="112" y="33" font-size="10" letter-spacing="1.5">DSH BRANCHLINE / 0.3.0</text>
<text x="20" y="91" font-size="29" font-weight="800" letter-spacing="-1.1">FRESH TRACKS</text>
<text x="20" y="124" font-size="29" font-weight="800" letter-spacing="-1.1">FOR EVERY TASK</text>
<text class="mute" x="20" y="151" font-size="11">origin/HEAD -> exact commit -> isolated Session</text>
<path class="rail" d="M58 186v186"/><path class="route" d="M58 186v58c0 20 18 24 35 24h78c18 0 34 10 34 30v38"/>
<circle class="node-live" cx="58" cy="186" r="8"/><circle class="node-live" cx="58" cy="244" r="8"/><circle class="node" cx="205" cy="336" r="8"/>
<text class="accent" x="78" y="190" font-size="11" font-weight="700">ORIGIN/HEAD</text>
<text x="78" y="248" font-size="11" font-weight="700">PINNED SHA</text>
<text x="225" y="340" font-size="11" font-weight="700">TASK / N</text>
<path class="rail-strong" d="M58 372h278"/><circle class="node" cx="58" cy="372" r="7"/><circle class="node" cx="336" cy="372" r="7"/>
<text class="mute" x="70" y="397" font-size="10">PRIMARY CHECKOUT / UNTOUCHED</text>
<rect class="tag" x="20" y="414" width="104" height="48" rx="4"/>
<text x="32" y="434" font-size="16" font-weight="700">48</text>
<text class="mute" x="32" y="451" font-size="9" letter-spacing="1.1">TESTS</text>
<rect class="tag" x="143" y="414" width="116" height="48" rx="4"/>
<text x="155" y="434" font-size="16" font-weight="700">4</text>
<text class="mute" x="155" y="451" font-size="9" letter-spacing="1.1">ROUTE STEPS</text>
<rect class="tag" x="278" y="414" width="92" height="48" rx="4"/>
<text x="290" y="434" font-size="16" font-weight="700">1</text>
<text class="mute" x="290" y="451" font-size="9" letter-spacing="1.1">RUNTIME DEP</text>

</svg>
