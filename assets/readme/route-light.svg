<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 205" width="880" height="205" role="img" aria-label="Four-step route: fetch the remote default, create an isolated checkout, open a native DSH session, and keep the branch for review.">
<style>
text{font-family:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#1f2328}
.mute{fill:#59636e}.accent{fill:#bc4c00}
.rail{fill:none;stroke:#d1d9e0;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rail-strong{fill:none;stroke:#1f2328;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.route{fill:none;stroke:#bc4c00;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 8;animation:flow 4.8s linear infinite}
.node{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:2}.node-live{fill:#fff1e5;stroke:#bc4c00;stroke-width:2.5;animation:pulse 2.4s ease-in-out infinite}
.tag{fill:#f6f8fa;stroke:#d1d9e0}.tag-live{fill:#fff1e5;stroke:#bc4c00}
@keyframes flow{to{stroke-dashoffset:-68}}@keyframes pulse{0%,100%{opacity:.62}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.route{stroke-dashoffset:0}.node-live{opacity:1}}
</style>

<text x="28" y="26" font-size="11" font-weight="700" letter-spacing="1.5">THE ROUTE / 4 VERIFIED STAGES</text>
<path class="rail" d="M54 86h612c38 0 44 42 82 42h78"/>
<path class="route" d="M54 86h612c38 0 44 42 82 42h78"/>
<circle class="node-live" cx="54" cy="86" r="10"/>
<text class="accent" x="40" y="51" font-size="10" font-weight="700">01</text>
<text x="36" y="126" font-size="12" font-weight="700">FETCH</text>
<text class="mute" x="36" y="146" font-size="10">origin/HEAD -&gt; &lt;sha&gt;</text>
<circle class="node" cx="258" cy="86" r="10"/>
<text class="accent" x="244" y="51" font-size="10" font-weight="700">02</text>
<text x="240" y="126" font-size="12" font-weight="700">ROUTE</text>
<text class="mute" x="240" y="146" font-size="10">git worktree add</text>
<circle class="node" cx="462" cy="86" r="10"/>
<text class="accent" x="448" y="51" font-size="10" font-weight="700">03</text>
<text x="444" y="126" font-size="12" font-weight="700">OPEN</text>
<text class="mute" x="444" y="146" font-size="10">worktree -&gt; workspace</text>
<circle class="node" cx="666" cy="86" r="10"/>
<text class="accent" x="652" y="51" font-size="10" font-weight="700">04</text>
<text x="648" y="126" font-size="12" font-weight="700">HOLD</text>
<text class="mute" x="648" y="146" font-size="10">allowDelivery: false</text>
<rect class="tag-live" x="28" y="166" width="824" height="27" rx="4"/>
<text class="accent" x="42" y="184" font-size="10" font-weight="700" letter-spacing=".7">PRIMARY CHECKOUT: NO SWITCH / RESET / STASH / CLEAN</text>

</svg>
